<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1, h2 {
            color: #333;
        }

        .section {
            background-color: white;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .job-box {
            padding: 10px;
            margin-top: 10px;
            background-color: #eeeeee;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Customer Dashboard</h1>

    <div class="section">
        <h2>Your Submitted Job Requests</h2>

        <div class="job-box">Job 1</div>
        <div class="job-box">Job 2</div>
        <div class="job-box">Posted jobs will appear here after the database is connected.</div>
    </div>

    <div class="section">
        <h2>Create a New Job Request</h2>
        <p>Use this option to post a new job to the marketplace.</p>
        <button>Create New Job</button>
    </div>

</body>
</html>
