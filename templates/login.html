<!DOCTYPE html>
<html>
<head>
    <title>SoSoSewing Login</title>
    <link rel="stylesheet" href="/static/styles/styles.css">
</head>
<body>
    <h1>Login to your SoSoSewing account</h1>
    <div class="section">
        <h2>Customer login</h2>
        <form id="email_form_customer">
            <input type="hidden" name="form_id" value="email_customer">

            <label for="email_customer">Email:</label>
            <input type="email" id="email_customer" name="email_customer">

            <input type="submit" value="Request 2FA">
        </form>

        <form method="POST" id="two_factor_form_customer">
            <input type="hidden" name="form_id" value="two_factor_customer">

            <label for="two_factor_customer">2FA Code:</label>
            <input type="text" id="two_factor_customer" name="two_factor_customer">

            <input type="submit" value="Login">
        </form>
    </div>

    <div class="section">
        <h2>Contractor login</h2>
        <form id="email_form_contractor">
            <input type="hidden" name="form_id" value="email_contractor">

            <label for="email_contractor">Email:</label>
            <input type="email" id="email_contractor" name="email_contractor">

            <input type="submit" value="Request 2FA">
        </form>

        <form method="POST" id="two_factor_form_contractor">
            <input type="hidden" name="form_id" value="two_factor_contractor">

            <label for="two_factor_contractor">2FA Code:</label>
            <input type="text" id="two_factor_contractor" name="two_factor_contractor">

            <input type="submit" value="Login">
        </form>
    </div>

    <script src="{{ url_for('static', filename='scripts/login.js') }}"></script>
</body>
</html>
