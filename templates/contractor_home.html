<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractor Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1, h2 {
            color: #333;
        }

        .section {
            background-color: white;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .job-box {
            padding: 10px;
            margin-top: 10px;
            background-color: #eeeeee;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h1>Contractor Dashboard</h1>

    <div class="section">
        <h2>Current Jobs in Progress</h2>

        <div class="job-box">Job 1</div>
        <div class="job-box">Job 2</div>
        <div class="job-box">Assigned jobs will appear here after the database is connected.</div>
    </div>

    <div class="section">
        <h2>Available Jobs on the Marketplace</h2>

        <div class="job-box">Available Job 1</div>
        <div class="job-box">Available Job 2</div>
        <div class="job-box">Available Job 3</div>
    </div>

</body>
</html>
